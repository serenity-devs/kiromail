name: kiromail

x-app-environment: &app-environment
  APP_URL: https://${APP_DOMAIN:?Define APP_DOMAIN}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-1025}
  AWS_REGION: ${AWS_REGION:-}
  UPLOAD_DIR: /app/uploads
  CONTENT_STORAGE_DIR: /app/message-content
  CONTENT_STORAGE: ${CONTENT_STORAGE:-filesystem}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PREFIX: ${S3_PREFIX:-kiromail}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SNS_TOPIC_ARNS: ${SNS_TOPIC_ARNS:-}
  ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
  TRANSACTIONAL_ATTACHMENT_MAX_BYTES: ${TRANSACTIONAL_ATTACHMENT_MAX_BYTES:-8388608}
  TRANSACTIONAL_MIME_MAX_BYTES: ${TRANSACTIONAL_MIME_MAX_BYTES:-40000000}
  TRUST_PROXY: "true"
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-600}
  SESSION_RATE_LIMIT_PER_MINUTE: ${SESSION_RATE_LIMIT_PER_MINUTE:-900}
  PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-30}
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  SESSION_SECRET_FILE: /run/secrets/session_secret
  DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
  AWS_ACCESS_KEY_ID_FILE: /run/secrets/aws_access_key_id
  AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/aws_secret_access_key
  AWS_SESSION_TOKEN_FILE: /run/secrets/aws_session_token

x-app-secrets: &app-secrets
  - database_url
  - redis_url
  - admin_password
  - session_secret
  - data_encryption_key
  - aws_access_key_id
  - aws_secret_access_key
  - aws_session_token

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-384m}
    environment:
      POSTGRES_DB: kiromail
      POSTGRES_USER: kiromail
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kiromail -d kiromail"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [private]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [private]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  migrate:
    profiles: [migration]
    image: ${KIROMAIL_IMAGE:?Define KIROMAIL_IMAGE}
    command: npm run db:setup:production
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-384m}
    environment: *app-environment
    secrets: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  kiromail-app:
    image: ${KIROMAIL_IMAGE:?Define KIROMAIL_IMAGE}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${APP_MEMORY_LIMIT:-384m}
    read_only: true
    environment:
      <<: *app-environment
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets:
      - database_url
      - redis_url
      - admin_password
      - session_secret
      - data_encryption_key
      - metrics_token
      - aws_access_key_id
      - aws_secret_access_key
      - aws_session_token
    volumes:
      - uploads_data:/app/uploads
      - content_data:/app/message-content
    tmpfs:
      - /tmp:size=128m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      private:
      public_proxy:
        aliases: [kiromail-app]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  worker:
    image: ${KIROMAIL_IMAGE:?Define KIROMAIL_IMAGE}
    command: npm run worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    mem_limit: ${WORKER_MEMORY_LIMIT:-320m}
    read_only: true
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SEND_RATE_PER_SECOND: ${SEND_RATE_PER_SECOND:-5}
      TRANSACTIONAL_WORKER_CONCURRENCY: ${TRANSACTIONAL_WORKER_CONCURRENCY:-2}
      TRANSACTIONAL_SEND_RATE_PER_SECOND: ${TRANSACTIONAL_SEND_RATE_PER_SECOND:-2}
      DATA_WORKER_CONCURRENCY: ${DATA_WORKER_CONCURRENCY:-1}
    secrets: *app-secrets
    volumes:
      - uploads_data:/app/uploads
      - content_data:/app/message-content
    tmpfs:
      - /tmp:size=96m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private, egress]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  backup:
    image: ${KIROMAIL_BACKUP_IMAGE:?Define KIROMAIL_BACKUP_IMAGE}
    restart: unless-stopped
    init: true
    mem_limit: ${BACKUP_MEMORY_LIMIT:-384m}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      BACKUP_ENCRYPTION_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    secrets: [database_url,backup_passphrase]
    volumes:
      - uploads_data:/data/uploads:ro
      - content_data:/data/message-content:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

networks:
  private:
    internal: true
  egress:
    driver: bridge
  public_proxy:
    external: true
    name: ${PUBLIC_PROXY_NETWORK:-valuebets_web}

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  content_data:
  backup_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  redis_password:
    file: ./secrets/redis_password
  redis_url:
    file: ./secrets/redis_url
  admin_password:
    file: ./secrets/admin_password
  session_secret:
    file: ./secrets/session_secret
  data_encryption_key:
    file: ./secrets/data_encryption_key
  metrics_token:
    file: ./secrets/metrics_token
  backup_passphrase:
    file: ./secrets/backup_passphrase
  aws_access_key_id:
    file: ./secrets/aws_access_key_id
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key
  aws_session_token:
    file: ./secrets/aws_session_token
