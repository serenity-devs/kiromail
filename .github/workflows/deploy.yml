name: Deploy production

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiromail-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_IMAGE: ghcr.io/serenity-devs/kiromail
      BACKUP_IMAGE: ghcr.io/serenity-devs/kiromail-backup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve release metadata
        id: release_metadata
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build application archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.APP_IMAGE }}:${{ env.RELEASE_SHA }}
          build-args: |
            VCS_REF=${{ env.RELEASE_SHA }}
            BUILD_DATE=${{ steps.release_metadata.outputs.build_date }}
          outputs: type=docker,dest=/tmp/kiromail-${{ env.RELEASE_SHA }}.tar
          cache-from: type=gha,scope=kiromail-app
          cache-to: type=gha,mode=max,scope=kiromail-app

      - name: Build backup archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backup
          platforms: linux/amd64
          push: false
          tags: ${{ env.BACKUP_IMAGE }}:${{ env.RELEASE_SHA }}
          build-args: VCS_REF=${{ env.RELEASE_SHA }}
          outputs: type=docker,dest=/tmp/kiromail-backup-${{ env.RELEASE_SHA }}.tar
          cache-from: type=gha,scope=kiromail-backup
          cache-to: type=gha,mode=max,scope=kiromail-backup

      - name: Compress and checksum archives
        run: |
          gzip -9 /tmp/kiromail-${RELEASE_SHA}.tar
          gzip -9 /tmp/kiromail-backup-${RELEASE_SHA}.tar
          cd /tmp
          sha256sum kiromail-${RELEASE_SHA}.tar.gz > kiromail-${RELEASE_SHA}.tar.gz.sha256
          sha256sum kiromail-backup-${RELEASE_SHA}.tar.gz > kiromail-backup-${RELEASE_SHA}.tar.gz.sha256
          printf '%s\n' "$RELEASE_SHA" > release.txt

      - name: Publish production release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view production >/dev/null 2>&1; then
            git tag production "$RELEASE_SHA"
            git push origin refs/tags/production
            gh release create production --prerelease --title "KiroMail production" --notes "Automated production artifacts."
          fi
          gh release upload production \
            /tmp/kiromail-${RELEASE_SHA}.tar.gz \
            /tmp/kiromail-${RELEASE_SHA}.tar.gz.sha256 \
            /tmp/kiromail-backup-${RELEASE_SHA}.tar.gz \
            /tmp/kiromail-backup-${RELEASE_SHA}.tar.gz.sha256 \
            --clobber
          gh release upload production /tmp/release.txt --clobber
          git tag --force production "$RELEASE_SHA"
          git push --force origin refs/tags/production
